# 티스토리 블로그 최신 글을 GitHub 프로필 README에 업데이트하는 워크플로우
# 수동으로 실행하거나 main 브랜치에 push/PR 시 자동 실행됩니다

name: Update Blog Posts

on:
  # 수동 실행을 위한 트리거 (GitHub Actions 탭에서 "Run workflow" 버튼으로 실행)
  workflow_dispatch:

  # main 브랜치에 push될 때 자동 실행
  push:
    branches: [ "main" ]

  # main 브랜치로 PR이 생성될 때 자동 실행
  pull_request:
    branches: [ "main" ]

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
    # 저장소 체크아웃
    - uses: actions/checkout@v4

    # Python 3.13 설정 (최신 안정 버전)
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    # 필요한 패키지 설치
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install feedparser

    # Python 스크립트 실행하여 README.md 업데이트
    - name: Run Update Python Script
      run: |
        python readme.py

    # 변경사항이 있을 때만 커밋 및 푸시
    - name: Commit and Push if changed
      run: | 
        git config --local user.email "gayulz@kakao.com"
        git config --local user.name "gayulz"
        git add README.md
        
        # 변경사항이 있는지 확인
        if git diff --staged --quiet; then
          echo "변경사항이 없습니다. 커밋을 건너뜁니다."
        else
          echo "README.md 파일이 업데이트되었습니다. 커밋을 진행합니다."
          git commit -m "📝 Update: 블로그 최신 글 업데이트"
          git push
        fi
