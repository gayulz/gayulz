# 프로필 3D 잔디(기여도 그래프) 이미지를 매일 자동 생성하는 워크플로우
# 생성물: profile-3d-contrib/*.svg  (README에서 night-rainbow 테마를 사용)

name: Profile 3D Contrib

on:
  # 매일 18:00 UTC = 한국시간 새벽 03:00
  schedule:
    - cron: "0 18 * * *"

  # Actions 탭에서 수동 실행
  workflow_dispatch:

# 생성된 SVG를 저장소에 커밋해야 하므로 쓰기 권한 필요
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib

    steps:
      - uses: actions/checkout@v5

      # GITHUB_TOKEN은 GitHub가 자동 발급하므로 별도 PAT 불필요
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and Push if changed
        run: |
          git config --local user.email "gayulz@kakao.com"
          git config --local user.name "gayulz"
          git add profile-3d-contrib

          if git diff --staged --quiet; then
            echo "변경사항이 없습니다. 커밋을 건너뜁니다."
          else
            git commit -m "🌱 Update: 3D 잔디 이미지 갱신"
            # 블로그 갱신 워크플로우가 먼저 커밋했을 수 있으므로 rebase 후 push
            git pull --rebase origin main
            git push
          fi
